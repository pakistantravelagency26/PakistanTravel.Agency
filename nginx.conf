# -------------------------------------------------------------
# PakistanTravel.Agency - Nginx Reverse Proxy Configuration
# Optimized for Cloudflare Proxy & Next.js Standalone
# -------------------------------------------------------------

# Upstream Next.js Container
upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

# 1. HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name pakistantravel.agency www.pakistantravel.agency;
    return 301 https://www.pakistantravel.agency$request_uri;
}

# 2. Apex domain HTTPS redirect to www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pakistantravel.agency;

    # SSL Certificates (Cloudflare Origin CA or Certbot)
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.pakistantravel.agency$request_uri;
}

# 3. Canonical www Production Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pakistantravel.agency;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cloudflare Real IP Restoration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Dynamic Next.js Routes & APIs
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}
